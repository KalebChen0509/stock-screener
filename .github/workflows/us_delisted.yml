name: 美股下市資料（倖存者偏差）
# 從 Tiingo 抓「抽樣 450 檔」下市美股的日線。免費帳號每小時約 50 次請求 → 每小時一批 45 檔，約 10 小時抓完；
# 每批存到 data 分支（只更新 cache/us_delisted，不會蓋掉其他資料）；一輪最多 5 批，沒抓完自動接下一輪。
on:
  workflow_dispatch:
concurrency:
  group: us-delisted
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_CACHE: ${{ github.workspace }}/databr/cache
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/data_branch.sh pull
      - name: 分批抓（每小時一批）
        id: loop
        run: |
          for i in 1 2 3 4 5; do
            t0=$(date +%s)
            out=$(python scripts/fetch_us_delisted.py --max-requests 45 --sleep 75 | tail -1)
            bash scripts/data_branch.sh push-us-delisted || true
            echo "batch $i: $out"
            if [ "$out" = "left=0" ]; then echo "complete=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            [ $i -lt 5 ] && sleep $(( 3660 - ($(date +%s) - t0) > 0 ? 3660 - ($(date +%s) - t0) : 0 ))
          done
          echo "complete=0" >> "$GITHUB_OUTPUT"
      - name: 還沒抓完 → 自動接下一輪
        if: steps.loop.outputs.complete == '0'
        run: gh workflow run us_delisted.yml -R "$GITHUB_REPOSITORY"
