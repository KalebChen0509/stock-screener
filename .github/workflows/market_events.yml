name: 市場事件偵測
# 備援（GitHub 排程常延遲好幾小時；主力是 Mac 的 scripts/mac_events.py，每 10 分鐘）。全天候：政策新聞（國安基金、限空令、央行、聯準會、熔斷…）＋市場壓力數字＋總經指標轉折（台美中日歐）。
# 「重大」立刻 Email＋LINE；「注意」每天早上彙整一封。紀錄存在 events 分支（網站直接讀，不用重新部署）。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: market-events
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      LINE_FOR: ${{ vars.LINE_FOR }}
      PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 總經指標（美國）；沒設定就改用 FRED 網頁 CSV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 取得 events 分支（沒有就建立空的）
        run: python scripts/events_sync.py pull --dir evbr --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - run: python scripts/market_events.py --store evbr
      - name: 存回 events 分支（單一 commit；Mac 同時推送時合併「已通知」紀錄）
        if: always()
        run: python scripts/events_sync.py push --dir evbr --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
