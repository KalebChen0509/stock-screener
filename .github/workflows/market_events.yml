name: 市場事件偵測
# 每 30 分鐘、全天候（含晚上、週末）：政策新聞（國安基金、限空令、央行、聯準會、熔斷…）＋市場壓力數字。
# 「重大」立刻 Email＋LINE；「注意」每天早上彙整一封。紀錄存在 events 分支（網站直接讀，不用重新部署）。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: market-events
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      LINE_FOR: ${{ vars.LINE_FOR }}
      PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 取得 events 分支（沒有就建立空的）
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" events >/dev/null 2>&1; then
            git clone -q --depth 1 --branch events "$REMOTE" evbr && rm -rf evbr/.git
          else
            mkdir -p evbr
          fi
      - run: python scripts/market_events.py --store evbr
      - name: 存回 events 分支（單一 commit，不會越來越大）
        if: always()
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd evbr && git init -q -b events && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm "events $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "$REMOTE" events
