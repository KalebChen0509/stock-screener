name: 台股財報回填
# 一次執行最多約 5.5 小時：每小時用完 FinMind 額度就存檔、等下一小時繼續；
# 還沒抓完就自動再啟動下一輪，不依賴排程。排程只當備援。
on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch:
concurrency:
  group: tw-backfill
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_CACHE: ${{ github.workspace }}/databr/cache
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/data_branch.sh pull
      - name: 分批回填（每小時一批）
        id: loop
        run: |
          for i in 1 2 3 4 5; do
            t0=$(date +%s)
            python scripts/fetch_tw.py --max-calls 570 || true
            bash scripts/data_branch.sh push-tw || true
            done=$(python -c "import json;d=json.load(open('$SCREENER_CACHE/tw_progress.json'));print(1 if d['have']>=d['total']*0.98 else 0)" 2>/dev/null || echo 0)
            echo "batch $i done=$done"
            if [ "$done" = "1" ]; then echo "complete=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            [ $i -lt 5 ] && sleep $(( 3660 - ($(date +%s) - t0) > 0 ? 3660 - ($(date +%s) - t0) : 0 ))
          done
          echo "complete=0" >> "$GITHUB_OUTPUT"
      - name: 還沒完成 → 自動接下一輪
        if: steps.loop.outputs.complete == '0'
        run: gh workflow run backfill.yml -R "$GITHUB_REPOSITORY"
      - name: 完成 → 觸發第一次完整回測
        if: steps.loop.outputs.complete == '1'
        run: |
          if [ ! -f "$SCREENER_CACHE/backtest_triggered" ]; then
            echo 1 > "$SCREENER_CACHE/backtest_triggered"
            bash scripts/data_branch.sh push-tw
            gh workflow run backtest.yml -R "$GITHUB_REPOSITORY"
          fi
