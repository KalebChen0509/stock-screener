name: 除錯：檢查財報欄位
on:
  workflow_dispatch:
    inputs:
      stock: { description: "台股代號", default: "2330" }
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/inspect_tw.py ${{ github.event.inputs.stock }}
      - name: 上傳到 debug 分支
        run: |
          cd debug && git init -q -b debug && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm debug && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug
