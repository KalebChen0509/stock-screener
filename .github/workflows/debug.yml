name: 除錯
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = 檢查台股財報欄位；probe = 檢查外部資料來源（籌碼、分析師預估、新聞、盤中報價）"
        type: choice
        options: [probe, inspect]
        default: probe
      stock: { description: "台股代號（inspect 用）", default: "2330" }
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - if: github.event.inputs.mode == 'inspect'
        run: python scripts/inspect_tw.py ${{ github.event.inputs.stock }}
      - if: github.event.inputs.mode != 'inspect'
        run: python scripts/probe_sources.py
      - name: 上傳到 debug 分支
        run: |
          cd debug && git init -q -b debug && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -qm debug && git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug
