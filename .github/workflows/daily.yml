name: 每日更新
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 台北時間週二～週六 06:30（美股收盤後）
  workflow_dispatch:
    inputs:
      skip_us:
        description: "略過美股財報下載（測試用）"
        default: "false"
      force_us:
        description: "強制重抓美股財報"
        default: "false"
concurrency:
  group: data-branch
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_CACHE: ${{ github.workspace }}/databr/cache
      SEC_RAW_DIR: /tmp/sec
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SEC_USER_AGENT: "${{ github.repository_owner }} personal-research ${{ secrets.SEC_CONTACT_EMAIL }}"
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      LINE_FOR: ${{ vars.LINE_FOR }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/data_branch.sh pull
      - name: 台股財報（增量）
        run: mkdir -p site/data/logs && set -o pipefail && python scripts/fetch_tw.py --max-calls 500 2>&1 | tee -a site/data/logs/fetch_tw.txt
        continue-on-error: true
      - name: 美股財報（SEC，距上次成功超過 6 天或尚無資料時才重抓，平日省 10～15 分鐘）
        # 11/13：原本看「UTC 週一」，但排程延遲跨過午夜就變週二 → 10/23 之後三週都沒更新。改成看上次成功的日期。
        if: ${{ github.event.inputs.skip_us != 'true' }}
        run: |
          last=$(cat databr/cache/us_fetched_at.txt 2>/dev/null || echo 2000-01-01)
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          if [ "$age" -ge 6 ] || [ ! -f databr/cache/us_fundamentals.csv.gz ] || [ "${{ github.event.inputs.force_us }}" = "true" ]; then
            set -o pipefail
            python scripts/fetch_us.py 2>&1 | tee site/data/logs/fetch_us.txt && date -u +%F > databr/cache/us_fetched_at.txt
          else
            echo "略過（上次成功 $last，$age 天前）"
          fi
        continue-on-error: true
      - name: 價格
        run: mkdir -p site/data/logs && set -o pipefail && python scripts/fetch_prices.py 2>&1 | tee -a site/data/logs/fetch_prices.txt
      - name: 台股籌碼＋美股分析師預估
        run: mkdir -p site/data/logs && python scripts/fetch_extra.py 2>&1 | tee -a site/data/logs/fetch_extra.txt
        continue-on-error: true
      - name: 衍生性商品（期交所＋VIX；只當訊號，不影響選股）
        run: mkdir -p site/data/logs && python scripts/fetch_derivs.py --max-requests 40 2>&1 | tee -a site/data/logs/fetch_derivs.txt
        continue-on-error: true
      - name: K 線資料（第一次分幾天回填 5 年日線）
        run: mkdir -p site/data/logs && python scripts/fetch_kline.py 2>&1 | tee -a site/data/logs/fetch_kline.txt
        continue-on-error: true
      - name: 篩選＋網站資料＋通知
        run: mkdir -p site/data/logs && set -o pipefail && python scripts/update_daily.py 2>&1 | tee -a site/data/logs/update_daily.txt
      - name: 儲存快取
        if: always()
        run: bash scripts/data_branch.sh push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
