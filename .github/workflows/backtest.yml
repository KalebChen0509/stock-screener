name: 回測
on:
  workflow_dispatch:
    inputs:
      start:
        description: "回測起始（YYYY-MM-DD，空白＝設定檔）"
        default: ""
      full_prices:
        description: "重新下載完整價格歷史"
        default: "true"
concurrency:
  group: data-branch
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCREENER_CACHE: ${{ github.workspace }}/databr/cache
      SEC_RAW_DIR: /tmp/sec
      SEC_USER_AGENT: "${{ github.repository_owner }} personal-research ${{ secrets.SEC_CONTACT_EMAIL }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/data_branch.sh pull
      - name: 美股財報（若尚未建立）
        run: '[ -f databr/cache/us_fundamentals.csv.gz ] || python scripts/fetch_us.py 2>&1 | tee site/data/logs/fetch_us.txt'
      - name: 價格
        run: |
          if [ "${{ github.event.inputs.full_prices }}" = "true" ]; then python scripts/fetch_prices.py --full 2>&1 | tee site/data/logs/fetch_prices.txt; else python scripts/fetch_prices.py 2>&1 | tee site/data/logs/fetch_prices.txt; fi
      - name: 回測
        run: |
          if [ -n "${{ github.event.inputs.start }}" ]; then python scripts/run_backtest.py --start "${{ github.event.inputs.start }}" 2>&1 | tee site/data/logs/run_backtest.txt; else python scripts/run_backtest.py 2>&1 | tee site/data/logs/run_backtest.txt; fi
      - name: 網站資料
        run: mkdir -p site/data/logs && set -o pipefail && python scripts/update_daily.py --no-notify 2>&1 | tee -a site/data/logs/update_daily.txt
      - if: always()
        run: bash scripts/data_branch.sh push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
