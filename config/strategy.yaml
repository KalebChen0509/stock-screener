# =====================================================================
#  價值型選股策略設定檔（所有門檻都可在這裡或網站上調整）
#  單位：比率一律用小數（0.15 = 15%）
#  流量項目（營收、利潤、現金流）一律用「近四季合計 TTM」
#  存量項目（資產、負債、權益）一律用「最新一季季末」
# =====================================================================

portfolio:
  base_currency: TWD
  initial_capital: 1000000          # 回測起始金額（新台幣）
  monthly_contribution_twd: 10000   # 下單清單用：每月新投入金額（新台幣）；用新資金補足低於目標的部位，原則上不賣股
  weights:                          # 資產配置（另有 fixed_sleeves 的全球大盤 50%）
    tw_stock: 0.25
    us_stock: 0.25
    etf: 0.0
  max_holdings_per_stock_sleeve: 30 # 通過條件的股票超過此數時，取排名前 N 檔
  etf_holdings: 6                   # ETF 不分市場，取綜合排名前 N 檔
  empty_sleeve: cash                # 某市場沒有股票通過時：cash = 持有現金
  fill_with_index:                  # 通過的股票太少時，空出來的名額改買大盤 ETF（不放現金、不重壓少數股票）
    enabled: true
    min_holdings: 10
    tw: "0050.TW"
    us: "SPY"
  rebalance: monthly                # 每月初依上月底資料換股，等權重
  fixed_sleeves:                    # 固定部位：核心 50% 全球大盤（永豐美股定期定額）
    - {name: "全球大盤", weight: 0.5, holdings: {VT: 1.0}}

# ---------------------------------------------------------------------
#  風險控管：個股停損
#  回測：每月底檢查一次（只有月資料）；每日更新：每天收盤後檢查並通知
#  報酬用「含息還原價」計算，除息造成的帳面下跌不會誤觸停損
# ---------------------------------------------------------------------
risk:
  stop_loss:
    enabled: true
    pct: 0.15                       # 從參考價下跌 15% 即賣出
    basis: entry                    # entry = 買進價；trailing = 買進後最高價（移動停損）；vol = 移動停損，幅度依個股波動調整
    vol_mult: 2.5                   # basis=vol 時：停損幅度 = 個股近 12 個月月報酬標準差 × 2.5
    vol_min: 0.08                   #   下限 8%
    vol_max: 0.35                   #   上限 35%
    apply_to: [tw, us]              # 只用在個股；ETF 已分散，不設停損
    reentry: cooldown               # cooldown = 冷卻固定月數後才可買回；ma = 至少 1 個月且站上 10 個月均線才可買回
    cooldown_months: 3
    reentry_ma_months: 10
    exit_delay_days: 1              # 回測：觸發後「隔 1 個交易日」才以收盤價賣出（模擬跳空、來不及成交）
    proceeds: cash                  # 停損賣出的錢先放現金，下次月初調倉再重新分配
  # 信用利差風險訊號（企業信用）：訊號成立的月份，把指定部位按比例減碼、放現金
  # 先回測驗證，確定有效再把 enabled 改成 true（每日系統也會照做）
  credit_overlay:
    enabled: false
    rule: hyg_ma                    # jump = 利差 3 個月內急升；z = 利差偏高且擴大；hyg_ma = HYG/IEF 跌破均線
    jump_pp: 0.5                    # jump：3 個月上升幾個百分點算急升
    z_min: 1.0                      # z：高於近 36 個月平均幾個標準差
    ma_months: 6                    # hyg_ma：均線月數
    scale: 0.5                      # 減碼到原本的幾成（0.5 = 減半）
    apply_to: [tw, us]              # 套用的部位：tw、us、core（核心 VT）

# 總經資料需要額外抓的價格代號
macro:
  tickers: [HYG, IEF]

# ---------------------------------------------------------------------
#  一、個股 Hard Filters（全部通過才入選）
#  source: user = 你提供的條件；added = 我補充的常用條件
# ---------------------------------------------------------------------
hard_filters:
  # ---- 你提供的條件 ----
  - id: cash_ratio
    source: user
    label: "1. 現金（含短期投資）占總資產 ≥ 15%"
    metric: cash_ratio
    op: ">="
    value: 0.15
    enabled: true
  - id: intangible_ratio
    source: user
    label: "2a. 資產結構單純：商譽＋無形資產占總資產 ≤ 15%"
    metric: intangible_ratio
    op: "<="
    value: 0.15
    enabled: true
  - id: lt_invest_ratio
    source: user
    label: "2b. 資產結構單純：長期投資占總資產 ≤ 20%"
    metric: lt_invest_ratio
    op: "<="
    value: 0.20
    enabled: true
  - id: inventory_vs_peers
    source: user
    label: "3. 存貨占總資產 ≤ 同產業中位數 + 1 個標準差"
    metric: inventory_ratio
    op: "<=peer"
    peer_k_std: 1.0
    peer_min_group: 5               # 同產業少於 5 家時改用全市場
    enabled: true
  - id: equity_ratio
    source: user
    label: "4. 股東權益占總資產 ≥ 40%"
    metric: equity_ratio
    op: ">="
    value: 0.40
    enabled: true
  - id: current_ratio
    source: user
    label: "5a. 短期負債不過多：流動比率 ≥ 150%"
    metric: current_ratio
    op: ">="
    value: 1.5
    enabled: true
  - id: quick_ratio
    source: user
    label: "5b. 短期負債不過多：速動比率 ≥ 100%"
    metric: quick_ratio
    op: ">="
    value: 1.0
    enabled: true
  - id: gross_margin
    source: user
    label: "6. 毛利率 ≥ 10%（近 3 年每年）"
    metric: gross_margin_min3y
    op: ">="
    value: 0.10
    enabled: true
  - id: op_margin
    source: user
    label: "7. 營業利益率 ≥ 15%（近 3 年每年）"
    metric: op_margin_min3y
    op: ">="
    value: 0.15
    enabled: true
  - id: op_to_gross
    source: user
    label: "8. 營業利益 / 毛利 ≥ 65%（研發費用率 ≥ 5% 的公司 ≥ 55%）"
    metric: op_to_gross
    op: ">="
    value: 0.65
    enabled: true
  - id: nonop_share
    source: user
    label: "9. 業外收支占稅前淨利 ≤ 10%（原 5%，避免誤殺現金多、利息收入高的公司）"
    metric: nonop_share
    op: "<="
    value: 0.10
    enabled: true
  - id: cfo_positive
    source: user
    label: "10. 營業活動現金流 > 0"
    metric: cfo
    op: ">"
    value: 0
    enabled: true
  - id: fcf_positive
    source: user
    label: "11. 自由現金流 > 0"
    metric: fcf
    op: ">"
    value: 0
    enabled: true
  - id: cfo_to_ni
    source: user
    label: "12. 營業現金流 / 稅後淨利 ≥ 50%（≥100% 在排名加分）"
    metric: cfo_to_ni
    op: ">="
    value: 0.50
    enabled: true
  - id: fcf_to_ni
    source: user
    label: "13. 自由現金流 / 稅後淨利 ≥ 30%（越高排名越前）"
    metric: fcf_to_ni
    op: ">="
    value: 0.30
    enabled: true
  - id: cfo_positive_3y
    source: user
    label: "15. 近 3 年每年營業現金流皆 > 0"
    metric: cfo_positive_3y
    op: "=="
    value: true
    enabled: true
  - id: cf_type
    source: user
    label: "16. 現金流類型為甲或乙（近 3 年合計：營業 +、投資 −）；丙丁戊不要碰"
    metric: cf_type_ok
    op: "=="
    value: true
    enabled: true
  # 第 14 條（籌資現金流為負）＝甲型 → 排名加分

  # ---- 補充條件 ----
  - id: exclude_financials
    source: added
    label: "排除金融保險業（財報結構不同；金融股曝險由 ETF 部位提供）"
    metric: is_financial
    op: "=="
    value: false
    enabled: true
  - id: net_income_positive
    source: added
    label: "稅後淨利 > 0（現金流比率才有意義）"
    metric: net_income
    op: ">"
    value: 0
    enabled: true
  - id: profitable_3y
    source: added
    label: "近 3 年每年稅後淨利皆為正"
    metric: profitable_3y
    op: "=="
    value: true
    enabled: true
  - id: roe
    source: added
    label: "ROE（近四季）≥ 8%"
    metric: roe
    op: ">="
    value: 0.08
    enabled: true
  - id: pe
    source: added
    label: "價值股估值：本益比 ≤ 25 倍"
    metric: pe
    op: "<="
    value: 25
    enabled: true
  - id: pb
    source: added
    label: "價值股估值：股價淨值比 ≤ 5 倍"
    metric: pb
    op: "<="
    value: 5
    enabled: true
  - id: dilution
    source: added
    label: "股數一年內膨脹 ≤ 5%（避免增資稀釋）"
    metric: share_growth
    op: "<="
    value: 0.05
    enabled: true
  - id: revenue_growth
    source: added
    label: "成長：近 3 年營收年複合成長率 ≥ 0%（不衰退）"
    metric: revenue_cagr_3y
    op: ">="
    value: 0
    enabled: true
  - id: sue_positive
    source: added
    label: "最近一季財報驚喜 ≥ 0（淨利不低於去年同季的正常波動範圍）"
    metric: sue
    op: ">="
    value: 0
    na_pass: true
    enabled: false
  - id: rev_growth_3m
    source: added
    label: "台股近 3 個月營收年增率 ≥ 0（月營收動能；美股與資料不足者不檢查）"
    metric: rev_yoy_3m
    op: ">="
    value: 0
    na_pass: true
    enabled: false
  - id: momentum
    source: added
    label: "防價值陷阱：近 12 個月股價表現不在市場最差 20%"
    metric: mom_12m_pct
    op: ">="
    value: 0.20
    enabled: true
    na_pass: true            # 上市未滿一年、沒有 12 個月股價時不扣分
  - id: pledge
    source: added
    label: "台股董監質押比 ≤ 30%（只有最新資料，回測不適用）"
    metric: pledge_ratio
    op: "<="
    value: 0.30
    enabled: true
    na_pass: true
  - id: event_veto
    source: added
    label: "近期無重大負面事件（美股 8-K 4.02/1.03/3.01/4.01；台股重大訊息關鍵字）"
    metric: event_veto
    op: "=="
    value: false
    enabled: true
    na_pass: true
  - id: market_cap
    source: added
    label: "市值下限：台股 ≥ 30 億台幣、美股 ≥ 3 億美元"
    metric: market_cap
    op: ">="
    value: {tw: 3.0e9, us: 3.0e8}
    enabled: true
  - id: liquidity
    source: added
    label: "流動性：日均成交值 台股 ≥ 1,000 萬台幣、美股 ≥ 200 萬美元"
    metric: avg_traded_value
    op: ">="
    value: {tw: 1.0e7, us: 2.0e6}
    enabled: true
  - id: history
    source: added
    label: "至少 16 季財報資料（3 年成長率需要）"
    metric: n_quarters
    op: ">="
    value: 16
    enabled: true

# ---------------------------------------------------------------------
#  一之二、景氣循環但書：不同景氣階段的強勢產業，套用調整後的門檻
#  （群組可重疊，後面的覆寫前面的；沒列到的條件維持預設）
# ---------------------------------------------------------------------
groups:
  financials:
    enabled: false        # 回測驗證後再開啟；開啟時金融股改用下方「金融股專屬條件」，不再一律排除
    label: "金融保險業（銀行、保險、金控、證券）：改用 ROE、淨值比、本益比、資本適足代理指標"
    rule: {metric: is_financial, op: "==", value: true}
  rd_heavy:
    label: "研發密集（美股：研發費用 ≥ 營收 5%；台股財報摘要沒有研發費用，改用研發密集產業）"
    rule: {metric: rd_to_revenue, op: ">=", value: 0.05}
    industries:
      tw: [半導體業, 光電業, 通信網路業, 電腦及週邊設備業, 電子零組件業, 其他電子業, 資訊服務業, 生技醫療業, 數位雲端, 電子工業, 其他電子類]
  cyclicals:
    label: "景氣循環股（復甦期、過熱期強勢）"
    industries:
      tw: [塑膠工業, 鋼鐵工業, 水泥工業, 航運業, 汽車工業, 化學工業, 橡膠工業, 紡織纖維, 造紙工業, 玻璃陶瓷, 電機機械, 建材營造業, 建材營造]
      us: ["Oil & Gas Extraction", "Petroleum Refining", "Primary Metals", "Metal Mining", "Coal Mining", "Paper",
           "Chemicals & Pharma", "Transportation Equipment", "Machinery & Computers", "Construction", "Lumber & Wood",
           "Stone, Clay & Glass", "Fabricated Metals", "Railroads", "Trucking", "Air Transport", "Water Transport",
           "Rubber & Plastics", "Textiles", "Pipelines"]
  discretionary:
    label: "非必需消費（復甦期強勢）"
    industries:
      tw: [貿易百貨業, 貿易百貨, 觀光餐旅, 觀光事業, 居家生活, 運動休閒]
      us: ["Retail", "Retail (Auto)", "Retail (Apparel)", "Retail (Furniture)", "Retail (Misc)", "Restaurants",
           "Hotels", "Apparel", "Recreation", "Furniture"]
  staples:
    label: "必需消費（衰退期防禦）"
    industries:
      tw: [食品工業]
      us: ["Food Products", "Tobacco", "Retail (Food)", "Household & Personal Products"]
  healthcare:
    label: "醫療保健（衰退期防禦）"
    industries:
      tw: [生技醫療業, 生技醫療]
      us: ["Pharma & Biotech", "Medical Devices", "Health Services"]
  utilities_telecom:
    label: "公用事業與電信（衰退期防禦）"
    industries:
      tw: [油電燃氣業]
      us: ["Utilities", "Telecom"]
    ids:
      tw: ["2412", "3045", "4904"]

overrides:
  financials:           # 金融業的資產負債表、現金流量表結構不同，一般公司的條件不適用
    exclude_financials: {enabled: false}
    cash_ratio: {enabled: false}
    lt_invest_ratio: {enabled: false}       # 放款與投資本來就是本業
    inventory_vs_peers: {enabled: false}
    equity_ratio: {value: 0.06}             # 資本適足的代理：權益 ÷ 總資產 ≥ 6%（銀行常見 6～10%）
    current_ratio: {enabled: false}
    quick_ratio: {enabled: false}
    gross_margin: {enabled: false}
    op_margin: {enabled: false}
    op_to_gross: {enabled: false}
    nonop_share: {enabled: false}
    cfo_positive: {enabled: false}          # 銀行的營業現金流隨存放款大幅波動，沒有意義
    fcf_positive: {enabled: false}
    cfo_to_ni: {enabled: false}
    fcf_to_ni: {enabled: false}
    cfo_positive_3y: {enabled: false}
    cf_type: {enabled: false}
    revenue_growth: {enabled: false}
    roe: {value: 0.09}                      # 金融股主要看 ROE
    pe: {value: 15}
    pb: {value: 1.5}                        # 銀行股估值的核心：股價淨值比
  rd_heavy:
    op_to_gross: {value: 0.55}
  cyclicals:            # 看「景氣循環平均」而非最差年；用股價淨值比估值（循環高峰時本益比會假性便宜）
    gross_margin: {metric: gross_margin_avg3y}
    op_margin: {metric: op_margin_avg3y, value: 0.10}
    profitable_3y: {enabled: false}
    revenue_growth: {enabled: false}
    pe: {enabled: false}
    pb: {value: 1.5}
  discretionary:        # 零售、餐飲毛利低、營業費用高是產業特性
    op_margin: {value: 0.08}
    op_to_gross: {value: 0.35}
    cash_ratio: {value: 0.08}
  staples:              # 品牌行銷費用高；現金需求較低
    op_margin: {value: 0.10}
    op_to_gross: {value: 0.40}
    cash_ratio: {value: 0.08}
  healthcare:           # 併購取得的專利、商譽多
    intangible_ratio: {value: 0.40}
    op_to_gross: {value: 0.55}
    cash_ratio: {value: 0.10}
  utilities_telecom:    # 受管制、資本密集：負債比高、流動比低、自由現金流常為負
    cash_ratio: {value: 0.02}
    equity_ratio: {value: 0.25}
    current_ratio: {value: 0.6}
    quick_ratio: {value: 0.4}
    lt_invest_ratio: {value: 0.30}
    fcf_positive: {enabled: false}
    fcf_to_ni: {enabled: false}
    revenue_growth: {enabled: false}

# ---------------------------------------------------------------------
#  一之三、市場 × 產業規則（新版，回測驗證後再開啟）
#  每檔股票依「市場 × 產業別」歸入一個產業模板（見 screener/industries.py）：
#    general 一般、cyclical 循環、financial 金融、construction 營建、utility 公用、defensive 防禦、
#    growth_watch 成長觀察（只估值不買）、biotech_research 新藥研究（不自動篩）、exclude 排除
#  估值與獲利條件改用「同業百分位」（peer_pct>=：在同市場、同產業別裡排第幾，0 = 最低、1 = 最高）；
#  同產業別不到 min_peers 家時改跟同模板的公司比，模板也不足時跟全市場比。
#  財務安全條件維持絕對門檻，依模板覆寫；最後再要求估值安全邊際 ≥ 0。
#  開啟後取代上面的 hard_filters／groups／overrides（舊規則保留做比較）。
# ---------------------------------------------------------------------
industry_rules:
  enabled: false
  min_peers: 15
  financials: false                 # 金融股可否買進（之後由景氣階段模組依階段開關）
  filters:
    # ---- 財務安全（你的第 1～5 條；現金比改成同業比較）----
    - {id: cash_rel, label: "1. 現金占總資產不落後同業（同業前 60%）", metric: cash_ratio, op: "peer_pct>=", value: 0.40, enabled: true}
    - {id: intangible_ratio, label: "2a. 商譽＋無形資產占總資產 ≤ 15%", metric: intangible_ratio, op: "<=", value: 0.15, enabled: true}
    - {id: lt_invest_ratio, label: "2b. 長期投資占總資產 ≤ 20%", metric: lt_invest_ratio, op: "<=", value: 0.20, enabled: true}
    - {id: inventory_vs_peers, label: "3. 存貨占總資產 ≤ 同業中位數＋1 個標準差", metric: inventory_ratio, op: "<=peer", peer_k_std: 1.0, peer_min_group: 5, enabled: true}
    - {id: equity_ratio, label: "4. 股東權益占總資產 ≥ 40%", metric: equity_ratio, op: ">=", value: 0.40, enabled: true}
    - {id: current_ratio, label: "5a. 流動比率 ≥ 150%", metric: current_ratio, op: ">=", value: 1.5, enabled: true}
    - {id: quick_ratio, label: "5b. 速動比率 ≥ 100%", metric: quick_ratio, op: ">=", value: 1.0, enabled: true}
    # ---- 獲利能力（你的第 6～9 條；改成同業比較＋最低底線）----
    - {id: gross_margin_rel, label: "6. 近 3 年最低毛利率不在同業最差 30%", metric: gross_margin_min3y, op: "peer_pct>=", value: 0.30, enabled: true}
    - {id: gross_margin_floor, label: "6'. 近 3 年每年毛利率 > 0", metric: gross_margin_min3y, op: ">", value: 0, enabled: true}
    - {id: op_margin_rel, label: "7. 近 3 年最低營益率在同業前一半", metric: op_margin_min3y, op: "peer_pct>=", value: 0.50, enabled: true}
    - {id: op_margin_floor, label: "7'. 近 3 年每年營益率 > 0", metric: op_margin_min3y, op: ">", value: 0, enabled: true}
    - {id: op_to_gross_rel, label: "8. 營業利益 ÷ 毛利不在同業最差 30%", metric: op_to_gross, op: "peer_pct>=", value: 0.30, enabled: true}
    - {id: nonop_share, label: "9. 業外收支占稅前淨利 ≤ 10%", metric: nonop_share, op: "<=", value: 0.10, enabled: true}
    # ---- 現金流品質（你的第 10～16 條，維持原樣）----
    - {id: cfo_positive, label: "10. 營業活動現金流 > 0", metric: cfo, op: ">", value: 0, enabled: true}
    - {id: fcf_positive, label: "11. 自由現金流 > 0", metric: fcf, op: ">", value: 0, enabled: true}
    - {id: cfo_to_ni, label: "12. 營業現金流 ÷ 稅後淨利 ≥ 50%", metric: cfo_to_ni, op: ">=", value: 0.50, enabled: true}
    - {id: fcf_to_ni, label: "13. 自由現金流 ÷ 稅後淨利 ≥ 30%", metric: fcf_to_ni, op: ">=", value: 0.30, enabled: true}
    - {id: cfo_positive_3y, label: "15. 近 3 年每年營業現金流 > 0", metric: cfo_positive_3y, op: "==", value: true, enabled: true}
    - {id: cfo_3y_total, label: "近 3 年營業現金流合計 > 0（營建用，取代逐年條件）", metric: cfo_3y, op: ">", value: 0, enabled: false}
    - {id: cf_type, label: "16. 現金流類型為甲或乙", metric: cf_type_ok, op: "==", value: true, enabled: true}
    # ---- 模板與金融股開關 ----
    - {id: buyable, label: "產業模板可自動買進（成長觀察、新藥研究、排除不買）", metric: buyable, op: "==", value: true, enabled: true}
    - {id: fin_allowed, label: "金融股開放買進（financials 開關；之後依景氣階段）", metric: fin_allowed, op: "==", value: true, enabled: true}
    # ---- 獲利與估值（同業比較＋安全邊際）----
    - {id: net_income_positive, label: "稅後淨利 > 0", metric: net_income, op: ">", value: 0, enabled: true}
    - {id: profitable_3y, label: "近 3 年每年稅後淨利皆為正", metric: profitable_3y, op: "==", value: true, enabled: true}
    - {id: roe_rel, label: "ROE 在同業前一半", metric: roe, op: "peer_pct>=", value: 0.50, enabled: true}
    - {id: roe_floor, label: "ROE ≥ 5%", metric: roe, op: ">=", value: 0.05, enabled: true}
    - {id: value_rel, label: "估值在同業較便宜的一半（EBIT ÷ 企業價值）", metric: earnings_yield, op: "peer_pct>=", value: 0.50, enabled: true}
    - {id: pb_hist, label: "股價淨值比低於自己近 10 年中位數（循環、營建）", metric: pb_hist_pct, op: "<=", value: 0.50, na_pass: true, enabled: false}
    - {id: gm_peak, label: "高峰警示：毛利率沒有高於長期平均 30% 以上（循環）", metric: gm_peak_ratio, op: "<=", value: 1.30, na_pass: true, enabled: false}
    - {id: mos, label: "估值安全邊際 ≥ 0（股價不高於合理價中位數）", metric: mos, op: ">=", value: 0.0, enabled: true}
    # ---- 其他（同舊規則）----
    - {id: dilution, label: "股數一年內膨脹 ≤ 5%", metric: share_growth, op: "<=", value: 0.05, enabled: true}
    - {id: revenue_growth, label: "近 3 年營收年複合成長率 ≥ 0%", metric: revenue_cagr_3y, op: ">=", value: 0, enabled: true}
    - {id: sue_positive, label: "最近一季財報驚喜 ≥ 0", metric: sue, op: ">=", value: 0, na_pass: true, enabled: false}
    - {id: rev_growth_3m, label: "台股近 3 個月營收年增率 ≥ 0", metric: rev_yoy_3m, op: ">=", value: 0, na_pass: true, enabled: false}
    - {id: momentum, label: "近 12 個月股價表現不在市場最差 20%", metric: mom_12m_pct, op: ">=", value: 0.20, na_pass: true, enabled: true}
    - {id: pledge, label: "台股董監質押比 ≤ 30%", metric: pledge_ratio, op: "<=", value: 0.30, na_pass: true, enabled: true}
    - {id: event_veto, label: "近期無重大負面事件", metric: event_veto, op: "==", value: false, na_pass: true, enabled: true}
    - {id: market_cap, label: "市值下限：台股 ≥ 30 億台幣、美股 ≥ 3 億美元", metric: market_cap, op: ">=", value: {tw: 3.0e9, us: 3.0e8}, enabled: true}
    - {id: liquidity, label: "流動性：日均成交值 台股 ≥ 1,000 萬台幣、美股 ≥ 200 萬美元", metric: avg_traded_value, op: ">=", value: {tw: 1.0e7, us: 2.0e6}, enabled: true}
    - {id: history, label: "至少 16 季財報資料", metric: n_quarters, op: ">=", value: 16, enabled: true}
  template_overrides:
    cyclical:             # 看景氣循環平均、用股價淨值比；高峰時本益比會假性便宜
      gross_margin_rel: {metric: gross_margin_avg3y}
      gross_margin_floor: {metric: gross_margin_avg3y}
      op_margin_rel: {metric: op_margin_avg3y}
      op_margin_floor: {metric: op_margin_avg3y}
      profitable_3y: {enabled: false}
      revenue_growth: {enabled: false}
      roe_rel: {metric: roe_norm}
      roe_floor: {metric: roe_norm}
      value_rel: {metric: book_to_price}
      pb_hist: {enabled: true}
      gm_peak: {enabled: true}
    construction:         # 完工才認列：獲利、現金流一年大一年小；土地與在建房屋就是存貨
      inventory_vs_peers: {enabled: false}
      quick_ratio: {enabled: false}
      equity_ratio: {value: 0.30}
      gross_margin_rel: {metric: gross_margin_avg3y}
      gross_margin_floor: {metric: gross_margin_avg3y}
      op_margin_rel: {metric: op_margin_avg3y}
      op_margin_floor: {metric: op_margin_avg3y}
      cfo_positive: {enabled: false}
      fcf_positive: {enabled: false}
      cfo_to_ni: {enabled: false}
      fcf_to_ni: {enabled: false}
      cfo_positive_3y: {enabled: false}
      cf_type: {enabled: false}
      cfo_3y_total: {enabled: true}
      profitable_3y: {enabled: false}
      revenue_growth: {enabled: false}
      roe_rel: {metric: roe_norm}
      roe_floor: {metric: roe_norm}
      value_rel: {metric: book_to_price}
      pb_hist: {enabled: true}
    financial:            # 資產負債表、現金流量表結構不同：看 ROE、淨值比、本益比、權益 ÷ 資產
      cash_rel: {enabled: false}
      lt_invest_ratio: {enabled: false}
      inventory_vs_peers: {enabled: false}
      equity_ratio: {value: 0.06}
      current_ratio: {enabled: false}
      quick_ratio: {enabled: false}
      gross_margin_rel: {enabled: false}
      gross_margin_floor: {enabled: false}
      op_margin_rel: {enabled: false}
      op_margin_floor: {enabled: false}
      op_to_gross_rel: {enabled: false}
      nonop_share: {enabled: false}
      cfo_positive: {enabled: false}
      fcf_positive: {enabled: false}
      cfo_to_ni: {enabled: false}
      fcf_to_ni: {enabled: false}
      cfo_positive_3y: {enabled: false}
      cf_type: {enabled: false}
      revenue_growth: {enabled: false}
      roe_floor: {value: 0.08}
      value_rel: {metric: ep}
    utility:              # 受管制、資本密集：負債高、流動比低、自由現金流常為負
      cash_rel: {enabled: false}
      equity_ratio: {value: 0.25}
      current_ratio: {value: 0.6}
      quick_ratio: {value: 0.4}
      lt_invest_ratio: {value: 0.30}
      fcf_positive: {enabled: false}
      fcf_to_ni: {enabled: false}
      revenue_growth: {enabled: false}
    defensive:            # 品牌、專利多來自併購
      intangible_ratio: {value: 0.40}
  industry_overrides:     # 個別產業別的專屬條件（鍵為正規化後的產業別名稱）
    tw:
      半導體業:
        rev_growth_3m: {enabled: true}      # 月營收近 3 個月年增 ≥ 0：庫存去化結束
    us: {}

# ---------------------------------------------------------------------
#  一之四、景氣階段模組（回測驗證後再開啟）
#  階段＝領先指標「位置 × 方向」：高於 100 往上＝擴張、高於 100 往下＝趨緩、低於 100 往上＝復甦、低於 100 往下＝衰退
#  台股：國發會領先指標不含趨勢指數；美股：OECD 領先指標，再加殖利率曲線倒掛與信用利差急升（只會把階段往後推）
#  各階段使用的篩選規則（理論版，2026/10/24 決定，不依回測結果調整）：
#    復甦：市場 × 產業規則＋金融股    擴張：原本 31 條規則
#    趨緩：市場 × 產業規則、不買金融股  衰退：市場 × 產業規則、不買金融股
# ---------------------------------------------------------------------
cycle:
  enabled: false
  lag_months: 1                     # 領先指標的公布時間差：月份 M 的數值在 M+1 月底才使用
  confirm_months: 2                 # 連續 2 個月同一階段才切換
  us_overlays:
    curve_inversion: true           # 10 年 − 3 個月殖利率倒掛：擴張 → 趨緩
    credit_jump_pp: 0.5             # Baa 信用利差 3 個月內擴大 ≥ 0.5 個百分點：往後推一個階段
  phase_rules:
    recovery:  {rule_set: new, financials: true}
    expansion: {rule_set: old, financials: false}
    slowdown:  {rule_set: new, financials: false}
    recession: {rule_set: new, financials: false}

# 換股緩衝區：新買進要通過全部條件；已持有的只要「門檻放寬 10% 仍通過」且排名在前 2 倍內就續抱
buffer:
  tolerance: 0.10
  rank_multiple: 2

# 重大事件否決（月數 = 事件發生後幾個月內排除）
events:
  veto_items: {"4.02": 12, "1.03": 24, "3.01": 12, "4.01": 6, "severe": 12}
  flag_items: {"2.06": 6, "2.05": 6, "5.02": 3, "warn": 3}

# ---------------------------------------------------------------------
#  二、個股排名（通過 hard filters 的股票才排名）
#  綜合分數 = Σ 權重 × 百分位（0~100）＋加分；百分位是「在全市場排第幾」
#  （新產業規則：在同業比較群組排第幾），所以分數代表贏過全市場百分之幾
# ---------------------------------------------------------------------
ranking:
  bottom_up:
    value:            # 價值 40%
      earnings_yield: 0.15    # EBIT / 企業價值（EV），越高越便宜
      fcf_yield: 0.15         # 自由現金流 / 市值
      book_to_price: 0.10     # 淨值 / 市值
    quality:          # 品質 30%
      fcf_to_ni: 0.10         # 你的第 13 條：越高越好
      cfo_to_ni: 0.05         # 你的第 12 條
      roe_5y: 0.10            # 近 5 年平均 ROE（避免單一好年份衝高排名）
      op_margin: 0.05
    safety:           # 安全 10%
      cash_ratio: 0.05
      equity_ratio: 0.05
  top_down: 0.20      # 由上而下（產業）20%
  bonuses:            # 額外加分（分數點數）
    cf_type_a: 4              # 甲型（營運成長及財務穩健，籌資為負）優先於乙型；含第 14 條
    cfo_to_ni_100: 2          # 第 12 條：營業現金流 ≥ 稅後淨利

# ---------------------------------------------------------------------
#  三、由上而下（Top-down）
#  1) 大盤多空：指數 vs 10 個月均線（顯示用，可選擇用於調整配置）
#  2) 產業評分：產業相對強弱（6 個月）50% + 產業估值（中位數盈餘殖利率）50%
#     每檔股票拿到所屬產業的百分位分數，計入綜合排名 20%
#  交叉比對：bottom-up 排名前 1/3 且產業分數前 1/2 → 標記「上下皆優」
# ---------------------------------------------------------------------
top_down:
  regime_ma_months: 10
  regime_indices: {tw: "^TWII", us: "^GSPC"}
  sector_momentum_months: 6
  sector_weights: {momentum: 0.5, valuation: 0.5}
  exclude_bottom_sectors_pct: 0.0   # 例如 0.25 = 排除產業分數最差的 25%（預設不排除）
  regime_defensive: false           # true = 大盤跌破均線時，該市場股票部位減半改持現金
  cross_check: {bottom_up_top: 0.3333, sector_top: 0.5}

# ---------------------------------------------------------------------
#  四、ETF 篩選
# ---------------------------------------------------------------------
etf:
  hard_filters:
    - {id: is_value,  label: "指數方法為價值／高股息／基本面加權", metric: is_value, op: "==", value: true, enabled: true}
    - {id: expense,   label: "總費用率 ≤ 0.60%", metric: expense_ratio, op: "<=", value: 0.0060, enabled: true}
    - {id: age,       label: "成立滿 3 年", metric: age_years, op: ">=", value: 3, enabled: true}
    - {id: aum,       label: "規模 ≥ 3 億美元（約 100 億台幣）", metric: aum_usd, op: ">=", value: 3.0e8, enabled: true}
    - {id: liquidity, label: "日均成交值 ≥ 100 萬美元", metric: avg_traded_value_usd, op: ">=", value: 1.0e6, enabled: true}
    - {id: top10,     label: "前十大持股占比 ≤ 60%", metric: top10_weight, op: "<=", value: 0.60, enabled: true}
    - {id: us_only,   label: "只選美國掛牌（分散台灣曝險）", metric: market, op: "==", value: us, enabled: false}
  ranking:
    expense_ratio: -0.30     # 負號 = 越低越好
    aum_usd: 0.10
    avg_traded_value_usd: 0.10
    tracking_vol: -0.10      # 對標指數的追蹤波動，越低越好（無資料時略過）
    top10_weight: -0.10
    value_tilt: 0.30         # ETF 本身的盈餘殖利率 + 淨值市價比（越便宜越高）

# ---------------------------------------------------------------------
#  五、交易成本與稅（回測「扣費後」情境）
# ---------------------------------------------------------------------
costs:
  tw_stock: {buy: 0.001425, sell: 0.004425}   # 手續費 0.1425% + 賣出證交稅 0.3%
  tw_etf:   {buy: 0.001425, sell: 0.002425}   # 手續費 0.1425% + 賣出證交稅 0.1%
  us:       {buy: 0.0008,   sell: 0.0008}     # 複委託網路下單 0.08%（國泰、永豐 2026 年優惠價；優惠結束請改回）
  us_dividend_withholding: 0.30               # 美股股利預扣 30%
  fx_spread: 0.0005                           # 換匯價差 0.05%（單邊）

# ---------------------------------------------------------------------
#  六、財報公布時間（避免前視偏誤）
#  台股：Q1→5/15、Q2→8/14、Q3→11/14、Q4（年報）→3/31
#  美股：使用 SEC 實際申報日（filed date）
# ---------------------------------------------------------------------
reporting_lag:
  tw: {Q1: "05-15", Q2: "08-14", Q3: "11-14", Q4: "03-31"}

# ---------------------------------------------------------------------
#  估值（合理價區間）：CAPM 折現率 + 剩餘收益模型 + 自由現金流折現 + 同業相對估值
#  以下為假設值，可依看法調整
# ---------------------------------------------------------------------
valuation:
  rf: {tw: 0.016, us: 0.045}        # 無風險利率；美股會自動改用 FRED 10 年期美債最新值，台股用這裡（約為台灣 10 年期公債殖利率）
  erp: {tw: 0.055, us: 0.045}       # 市場風險溢酬（股票比公債多要求的報酬）
  terminal_g: {tw: 0.02, us: 0.025} # 永續成長率（不超過長期名目經濟成長）
  beta_months: 60                   # β 用近幾個月的月報酬估
  fade_years: 10                    # 剩餘收益模型：ROE 幾年內回到要求報酬率
  g1_bounds: [-0.03, 0.12]          # DCF 第 1～5 年成長率上下限
  re_bounds: [0.06, 0.16]           # 要求報酬率上下限
  undervalued: 0.30                 # 安全邊際 ≥ 30% 標為「低估」
  overvalued: -0.20                 # 安全邊際 ≤ −20% 標為「高估」

backtest:
  start: "2016-10-01"
  end: "latest"
  risk_free: 0.015
  benchmarks: ["0050.TW", "SPY", "VT"]
  # 一次回測多組方案做比較（只影響回測頁的「方案比較」，不影響每日選股）
  # 危機壓力測試區間（完整策略；以混合基準的谷底區分「跌段」與「反彈段」）
  crises:
    - {name: "2018Q4 升息＋貿易戰", start: "2018-09", end: "2019-06"}
    - {name: "2020 新冠崩盤（V 型）", start: "2020-01", end: "2020-12"}
    - {name: "2022 升息空頭（慢跌）", start: "2021-12", end: "2023-06"}
    - {name: "2024/8 日圓套利平倉", start: "2024-06", end: "2025-01"}
    - {name: "2025/4 關稅衝擊", start: "2025-01", end: "2025-10"}
  # 指數壓力測試（只測停損規則本身；使用「只改 risk」的方案）
  stress:
    assets: ["^TWII", "0050.TW", "0056.TW", "IWD", "IWN", "SPY"]
    episodes:
      - {name: "2000-02 網路泡沫", start: "2000-01-01", trough_by: "2003-04-30"}
      - {name: "2008 金融海嘯", start: "2007-10-01", trough_by: "2009-04-30"}
      - {name: "2011 歐債危機", start: "2011-04-01", trough_by: "2012-01-31"}
      - {name: "2015 中國股災", start: "2015-04-01", trough_by: "2016-03-31"}
      - {name: "2018Q4 升息＋貿易戰", start: "2018-09-01", trough_by: "2019-01-31"}
      - {name: "2020 新冠崩盤", start: "2020-01-15", trough_by: "2020-04-30"}
      - {name: "2022 升息空頭", start: "2022-01-01", trough_by: "2022-12-31"}
    rebound_months: 12              # 谷底後再看 12 個月，衡量「錯過的反彈」
  variants:
    # ---- 停損規則（目前配置：VT 50％＋台美個股 50％＋大盤補位）----
    - name: "目前版（買進價停損15%）"
      group: stop
      patch: {}
    - name: "無停損"
      group: stop
      patch: {risk: {stop_loss: {enabled: false}}}
    - name: "移動停損15%"
      group: stop
      patch: {risk: {stop_loss: {basis: trailing}}}
    # ---- 信用利差減碼（先驗證再決定要不要啟用）----
    - name: "利差急升→個股減半"
      group: macro
      patch: {risk: {credit_overlay: {enabled: true, rule: jump}}}
    - name: "利差偏高擴大→個股減半"
      group: macro
      patch: {risk: {credit_overlay: {enabled: true, rule: z}}}
    - name: "HYG/IEF 走弱→個股減半"
      group: macro
      patch: {risk: {credit_overlay: {enabled: true, rule: hyg_ma}}}
    - name: "HYG/IEF 走弱→全部股票減半"
      group: macro
      patch: {risk: {credit_overlay: {enabled: true, rule: hyg_ma, apply_to: [tw, us, core]}}}
    # ---- 新因子與金融股（先驗證再決定要不要啟用）----
    # 註：目前通過條件的股票少於持股上限，「排名」幾乎不影響選股，所以新因子用「條件」來測
    - name: "財報驚喜為負不買"
      group: factor
      patch: {hard_filters: {sue_positive: {enabled: true}}}
    - name: "台股月營收衰退不買"
      group: factor
      patch: {hard_filters: {rev_growth_3m: {enabled: true}}}
    - name: "納入金融股（專屬條件）"
      group: factor
      patch: {groups: {financials: {enabled: true}}}
    # ---- 市場 × 產業規則（新版）----
    - name: "產業規則（新）"
      group: rules
      patch: {industry_rules: {enabled: true}}
    - name: "產業規則＋金融股"
      group: rules
      patch: {industry_rules: {enabled: true, financials: true}}
    - name: "景氣階段切換（理論版）"
      group: rules
      patch: {cycle: {enabled: true}}
    # ---- 資產配置比較（都用買進價停損 15%）----
    - name: "舊配置 台20美20ETF60＋補位"
